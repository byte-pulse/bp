server:
  port: 19420
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 200
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 50

spring:
  profiles:
    active: druid,dev
  application:
    name: byte-pulse
  # 序列化设置
  jackson:
    # 时区
    time-zone: GMT+8
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    # redis配置
    redis:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 4096MB

# 接口文档设置
springdoc:
  swagger-ui:
    doc-expansion: none # 文档折叠（可选值：none, list, full）
    tags-sorter: alpha # 按字母排序标签
    operations-sorter: alpha # 按字母排序操作
    defaultModelsExpandDepth: -1 # 折叠模型

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: off

# 分页插件配置
pagehelper:
  # 数据库方言
  helper-dialect: mysql
  # 分页合理化
  reasonable: true
  params: count=countSql
  support-methods-arguments: true

redis:
  prefix: "admin:"

project:
  url: https://gitee.com/byte-pulse/bp

# 接口是否返回内部错误信息
exception:
  processer:
    debugInfo: true
