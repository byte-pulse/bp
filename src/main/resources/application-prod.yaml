# 生产环境配置
spring:
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/master_prod?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: root
          password: passwd
          driverClassName: com.mysql.cj.jdbc.Driver
  #        slave:
  #          url: jdbc:mysql://127.0.0.1:3306/slave_prod?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
  #          username: root
  #          password: passwd
  #          driverClassName: com.mysql.cj.jdbc.Driver
  data:
    # redis配置
    redis:
      # 地址
      host: 127.0.0.1
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: quickly-prod

# 接口是否返回内部错误信息
exception:
  processer:
    debugInfo: false
